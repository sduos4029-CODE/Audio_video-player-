[package]
name = "pulse-adblock"
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
adblock = { version = "=0.13.5", default-features = false, features = ["embedded-domain-resolver", "full-regex-handling", "resource-assembler"] }
jni = { version = "=0.21.1", default-features = false }
serde_json = "1"

[profile.release]
lto = true
codegen-units = 1
strip = "symbols"
