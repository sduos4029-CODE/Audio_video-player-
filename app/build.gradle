plugins { id 'com.android.application' }
android {
 namespace 'com.noir.player'
 compileSdk 35
 defaultConfig { applicationId 'com.noir.player'; minSdk 26; targetSdk 35; versionCode 2; versionName '1.1' }
 testOptions { unitTests.includeAndroidResources = true }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}

dependencies {
 implementation "androidx.media3:media3-exoplayer:1.5.1"
 implementation "androidx.media3:media3-exoplayer-hls:1.5.1"
 implementation "androidx.media3:media3-exoplayer-dash:1.5.1"
 testImplementation "junit:junit:4.13.2"
 testImplementation "org.robolectric:robolectric:4.14.1"
}

tasks.withType(Test).configureEach {
 if (new File("/etc/ssl/certs/java/cacerts").exists()) systemProperty "javax.net.ssl.trustStore", "/etc/ssl/certs/java/cacerts"
 ["https.proxyHost", "https.proxyPort", "http.proxyHost", "http.proxyPort"].each { key -> if (System.getProperty(key)) systemProperty key, System.getProperty(key) }
 systemProperty "robolectric.dependency.repo.url", "https://repo.maven.apache.org/maven2"
}
